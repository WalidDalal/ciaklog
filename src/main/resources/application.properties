spring.application.name=ciaklog

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ciaklog_db
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Paginazione
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# JWT
jwt.secret=LA_TUA_CHIAVE_JWT_REALE
jwt.expiration=28800000

# TMDB — Bearer token lungo (non la API key corta)
tmdb.api.key=IL_TUO_TOKEN_BEARER_TMDB

# Groq
groq.api.key=LA_TUA_CHIAVE_GROQ

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500